<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }} — Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="app-body">
  <div class="app-bg" aria-hidden="true">
    <span class="ribbon ribbon-blue"></span>
    <span class="ribbon ribbon-red"></span>
    <span class="dot-field"></span>
  </div>

  <header class="app-topbar">
    <div class="topbar-brand">
      <img
        src="{{ url_for('static', filename='images/letran-calamba-logo.png') }}"
        alt=""
        width="36"
        height="36"
      />
      <div>
        <p class="topbar-title">Bloom</p>
        <p class="topbar-sub">{{ title }}</p>
      </div>
    </div>
    <a class="text-link" href="{{ url_for('home') }}">Back</a>
  </header>

  <main class="app-main">
    <section class="placeholder-card">
      <h1 class="section-title">{{ title }}</h1>
      <p class="section-note">{{ message }}</p>
      {% if user.role == 'student' %}
        <a class="btn-primary btn-inline" href="{{ url_for('home') }}">Back to Home</a>
      {% else %}
        <a class="btn-primary btn-inline" href="{{ url_for('logout') }}">Sign Out</a>
      {% endif %}
    </section>
  </main>

  {% if user.role == 'student' %}
  <nav class="app-tabbar tabbar-4" aria-label="Student navigation">
    <a class="tab {% if active_tab == 'home' %}active{% endif %}" href="{{ url_for('home') }}"><span>Home</span></a>
    <a class="tab {% if active_tab == 'practice' %}active{% endif %}" href="{{ url_for('practice') }}"><span>Practice</span></a>
    <a class="tab {% if active_tab == 'results' %}active{% endif %}" href="{{ url_for('results') }}"><span>Results</span></a>
    <a class="tab {% if active_tab == 'profile' %}active{% endif %}" href="{{ url_for('profile') }}"><span>Profile</span></a>
  </nav>
  {% endif %}
</body>
</html>
