{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <ul class="flash-list home-flash" role="status" aria-live="polite">
      {% for category, message in messages %}
        <li class="flash flash-{{ category }} pro-toast-in" data-flash-category="{{ category }}">
          <span class="flash-text">{{ message }}</span>
          <button type="button" class="flash-dismiss" aria-label="Dismiss message">×</button>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}
