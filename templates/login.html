<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Mirage Smoke Lineups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="login-page">
    <div class="mirage-stage" aria-hidden="true">
      <div class="mirage-sky"></div>
      <div class="mirage-walls"></div>
      <div class="arch arch-left"></div>
      <div class="arch arch-right"></div>
      <span class="smoke smoke-a"></span>
      <span class="smoke smoke-b"></span>
      <span class="smoke smoke-c"></span>
      <span class="lineup-beam"></span>
      <span class="crosshair"></span>
    </div>

    <aside class="login-brand" aria-label="Mirage Smoke Lineups branding">
      <div class="brand-mark">
        <svg class="brand-logo" viewBox="0 0 80 80" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="nadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2dd4bf" />
              <stop offset="100%" stop-color="#0f766e" />
            </linearGradient>
          </defs>
          <circle cx="40" cy="40" r="28" fill="none" stroke="url(#nadeGrad)" stroke-width="3" opacity="0.85" />
          <path d="M40 18v10M40 52v10M18 40h10M52 40h10" stroke="#f0e6d2" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="40" cy="40" r="6" fill="#2dd4bf" />
          <path d="M28 58c4-8 8-12 12-14 4 2 8 6 12 14" fill="none" stroke="#e8e4dc" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
        </svg>
        <p class="brand-name">MIRAGE</p>
        <p class="brand-tagline">Smoke Lineups</p>
      </div>
    </aside>

    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-module">
        <div class="module-glow" aria-hidden="true"></div>
        <p class="module-kicker">A-site · window · jungle</p>
        <h1 id="login-title">Sign in to train lineups</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flash-list">
              {% for category, message in messages %}
                <li class="flash flash-{{ category }}">{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form class="login-form" method="POST" action="{{ url_for('login') }}">
          <div class="field">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              required
              placeholder="Callsign"
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="Password"
            />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Deploy</button>
            <a class="access-link" href="#">Can't access account</a>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
