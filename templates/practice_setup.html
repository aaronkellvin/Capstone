<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Setup — Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="app-body">
  <div class="app-bg" aria-hidden="true">
    <span class="ribbon ribbon-blue"></span>
    <span class="ribbon ribbon-red"></span>
    <span class="dot-field"></span>
  </div>

  {% set topbar_sub = "Practice Check" %}
  {% include "partials/topbar.html" %}

  <main class="app-main">
    <section class="lobby-card" aria-labelledby="practice-setup-title">
      <a class="hub-back" href="{{ back_href }}">Back</a>
      <p class="hero-kicker summary-kicker">{{ subject.name }} · Practice Check</p>
      <h1 id="practice-setup-title" class="section-title">Practice this lesson</h1>
      <p class="section-note">{{ material_title }} · From approved material only. Not an official grade.</p>

      <form class="practice-form" method="get" action="{{ url_for('practice') }}">
        <fieldset class="practice-fieldset">
          <legend>Choose focus</legend>
          <label class="choice"><input type="radio" name="focus" value="mixed" checked /> Mixed HOTS</label>
          <label class="choice"><input type="radio" name="focus" value="c4" /> Analyze</label>
          <label class="choice"><input type="radio" name="focus" value="c5" /> Evaluate</label>
          <label class="choice"><input type="radio" name="focus" value="c6" /> Create</label>
        </fieldset>

        <div class="field">
          <label for="count">How many questions?</label>
          <select id="count" name="count">
            <option value="5" selected>5</option>
            <option value="8">8</option>
            <option value="10">10</option>
          </select>
        </div>

        <fieldset class="practice-fieldset">
          <legend>Include</legend>
          <label class="choice"><input type="checkbox" name="types" value="mcq" checked /> Multiple choice</label>
          <label class="choice"><input type="checkbox" name="types" value="essay" checked /> Essay</label>
          <label class="choice"><input type="checkbox" name="types" value="problem" checked /> Problem-solving</label>
        </fieldset>

        <button type="submit" class="btn-primary">Generate Practice Check</button>
      </form>
    </section>
  </main>

  <nav class="app-tabbar tabbar-4" aria-label="Student navigation">
    <a class="tab" href="{{ url_for('home') }}"><span>Home</span></a>
    <a class="tab active" href="{{ url_for('practice') }}"><span>Practice</span></a>
    <a class="tab" href="{{ url_for('results') }}"><span>Results</span></a>
    <a class="tab" href="{{ url_for('profile') }}"><span>Profile</span></a>
  </nav>
  <script src="{{ url_for('static', filename='js/topbar.js') }}"></script>
</body>
</html>
