<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=inter2" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bloom-pro.css') }}?v=inter2" />
</head>
<body>
  <div class="pro-login">
    <div class="pro-login-card">
      <p class="pro-hero-kicker">Bloom</p>
      <h1 class="pro-login-title">{{ title }}</h1>
      <p class="section-note">{{ message }}</p>
      <div class="lobby-actions" style="margin-top: 1rem;">
        <a class="btn-primary btn-inline" href="{{ url_for('home') if user else url_for('login') }}">
          {{ "Go to Home" if user else "Sign in" }}
        </a>
      </div>
    </div>
  </div>
</body>
</html>
