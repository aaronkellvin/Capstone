<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="app-body">
  <div class="app-bg" aria-hidden="true">
    <span class="ribbon ribbon-blue"></span>
    <span class="ribbon ribbon-red"></span>
    <span class="dot-field"></span>
  </div>
  <main class="app-main">
    <section class="lobby-card">
      <p class="hero-kicker">Bloom</p>
      <h1 class="section-title">{{ title }}</h1>
      <p class="section-note">{{ message }}</p>
      <div class="lobby-actions">
        <a class="btn-primary btn-inline" href="{{ url_for('home') if user else url_for('login') }}">
          {{ "Go to Home" if user else "Sign in" }}
        </a>
      </div>
    </section>
  </main>
</body>
</html>
