<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="login-page">
    <section class="login-shell" style="width: min(100%, 440px);">
      <div class="login-card">
        <h1 class="brand-name" style="font-size: 2.5rem;">Bloom</h1>
        <p class="login-subtitle" style="margin-bottom: 0.75rem;">
          Signed in as <strong>{{ user.name }}</strong> ({{ user.role }}).
        </p>
        <p class="login-help" style="margin-top: 0; margin-bottom: 1.25rem;">
          Home dashboard comes next. This page is only a placeholder after login.
        </p>
        <a class="btn-primary" href="{{ url_for('logout') }}" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">
          Sign Out
        </a>
      </div>
    </section>
  </main>
</body>
</html>
