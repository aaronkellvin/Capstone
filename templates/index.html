<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="login-page">
    <section class="pass" style="width: min(100%, 440px);">
      <div class="pass-body" style="padding-top: 1.6rem;">
        <h1 class="brand-name" style="text-align: center; font-size: 2.4rem;">Bloom</h1>
        <p class="pass-intro">
          Signed in as <strong>{{ user.name }}</strong> ({{ user.role }}).
        </p>
        <p class="login-help" style="margin-bottom: 1.1rem;">
          Home dashboard comes next. This page is only a placeholder after login.
        </p>
        <a class="btn-primary" href="{{ url_for('logout') }}" style="text-decoration: none;">
          <span>Sign Out</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
